<!doctype html>
<html lang="es" data-resolution="portrait-4k">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 2160px; height: 3840px; overflow: hidden; background: #09040f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #zoom { position: absolute; inset: 0; transform-origin: 50% 30%; }
      #base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .layer { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.3" data-width="2160" data-height="3840">
      <div id="zoom"><video id="base" class="clip" src="assets/base.mp4" playsinline data-has-audio="true" data-start="0" data-duration="38.3" data-track-index="0"></video></div>
      <div id="graphics-host" class="layer" data-composition-id="graphics" data-composition-src="compositions/graphics.html" data-start="0" data-duration="38.3" data-track-index="2" data-width="2160" data-height="3840"></div>
      <div id="captions-host" class="layer" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions" data-start="0" data-duration="38.3" data-track-index="3" data-width="2160" data-height="3840"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#zoom", { scale: 1.08 }, { scale: 1, duration: 1.6, ease: "power3.out" }, 0.0);
      tl.fromTo("#zoom", { scale: 1 }, { scale: 1.035, duration: 2.6, ease: "sine.inOut" }, 2.3);
      tl.fromTo("#zoom", { scale: 1.035 }, { scale: 1.05, duration: 1.6, ease: "power2.inOut" }, 7.0);
      tl.fromTo("#zoom", { scale: 1.05 }, { scale: 1, duration: 1.4, ease: "power2.inOut" }, 9.3);
      tl.fromTo("#zoom", { scale: 1.05 }, { scale: 1, duration: 1.3, ease: "power3.out" }, 18.74);
      tl.fromTo("#zoom", { scale: 1 }, { scale: 1.045, duration: 2.4, ease: "power2.inOut" }, 20.9);
      tl.fromTo("#zoom", { scale: 1.045 }, { scale: 1, duration: 1.5, ease: "power2.inOut" }, 24.0);
      tl.fromTo("#zoom", { scale: 1 }, { scale: 1.04, duration: 3.6, ease: "sine.inOut" }, 31.2);
      tl.fromTo("#zoom", { scale: 1.04 }, { scale: 1.1, duration: 2.6, ease: "power2.inOut" }, 35.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
