<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--ink:#0f1a14;--mut:#5d7a68;--ac:#16a34a;--ac2:#0a6b34;--ln:rgba(10,107,52,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));font:16px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:#f3f7f4;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 80% 0,#e3f5ea,#f3f7f4 60%)}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:fl 14s ease-in-out infinite}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:#86efac}
.bg i:nth-child(2){width:38vmax;height:38vmax;right:-10vmax;bottom:-12vmax;background:#a7f3d0;animation-delay:-5s}
.bg i:nth-child(3){width:26vmax;height:26vmax;left:40%;top:45%;background:#bbf7d0;animation-delay:-9s}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,3vmax) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.shell{position:relative;z-index:1;width:100%;max-width:980px;display:grid;grid-template-columns:1fr;border:1px solid var(--ln);border-radius:28px;overflow:hidden;background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px -20px #0f3d2a40,0 2px 6px #0f3d2a12,inset 0 1px 0 #fff;animation:rise .8s both}
.side{padding:30px 26px;max-width:460px;width:100%;margin:0 auto}

h1{font:800 1.9rem/1.1 'Bricolage Grotesque',Figtree,sans-serif;margin:6px 0 4px;text-align:center;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#16a34a,#0a6b34);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);font-size:.9rem;margin:0 0 18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--ln);border-radius:99px;background:#eef5f0;margin-bottom:6px}
.seg button{border:0;border-radius:99px;padding:10px;background:none;color:var(--mut);font:700 .92rem Figtree,sans-serif;cursor:pointer;transition:.25s}
.seg button.on{background:linear-gradient(135deg,#22c55e,#0a6b34);color:#fff;box-shadow:0 6px 18px #22c55e55}
label{display:block;font-size:.78rem;font-weight:700;color:var(--mut);margin:14px 0 6px 6px;letter-spacing:.04em;text-transform:uppercase}
.f{position:relative}.f input{width:100%;padding:14px 46px 14px 18px;border:1px solid var(--ln);border-radius:99px;background:#f7faf8;color:var(--ink);font:600 1rem Figtree,sans-serif;outline:0;transition:.2s}
.f input::placeholder{color:#9bb3a4}.f input:focus{border-color:var(--ac);box-shadow:0 0 0 4px #16a34a26;background:#fff}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.eye:hover{color:#0a6b34}.eye svg{width:20px;height:20px}
.row{display:flex;justify-content:space-between;align-items:center;margin:14px 6px 4px;font-size:.85rem;color:var(--mut)}
.row label{display:flex;align-items:center;gap:8px;margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:600;cursor:pointer}
.row input{accent-color:var(--ac);width:16px;height:16px}
.lk{background:none;border:0;color:#0a6b34;font:600 .85rem Figtree,sans-serif;cursor:pointer;padding:0}.lk:hover{text-decoration:underline}
.go{width:100%;margin-top:16px;padding:15px;border:0;border-radius:99px;background:linear-gradient(135deg,#34d399,#16a34a 55%,#0a6b34);color:#fff;font:800 1.05rem Figtree,sans-serif;cursor:pointer;box-shadow:0 10px 26px -6px #16a34a88;transition:.2s;display:flex;justify-content:center;gap:10px;align-items:center}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 36px #22c55e77}.go:active{transform:none}.go:disabled{opacity:.7;cursor:wait}
.sp{width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}.go:disabled .sp{display:block}@keyframes rot{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;margin:18px 0 12px;color:var(--mut);font-size:.8rem}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.ad{width:100%;padding:13px;border:1px solid var(--ln);border-radius:99px;background:#fff;color:var(--ink);font:700 .92rem Figtree,sans-serif;cursor:pointer;transition:.2s}.ad:hover{background:#f0faf4;border-color:var(--ac)}
#m{margin-top:14px;padding:11px 14px;border-radius:16px;font-weight:600;font-size:.88rem;display:none}
#m.e{display:block;background:#fdecee;color:#b4132a;border:1px solid #f5c2c9}#m.o{display:block;background:#e7f7ed;color:#0a6b34;border:1px solid #b7e6c8}
.hid{display:none}
.hero{display:none;position:relative;color:#fff;overflow:hidden;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px;background:radial-gradient(80% 70% at 50% 85%,#7cf0b8aa,#16a34a55 45%,transparent 75%),linear-gradient(160deg,#0a6b34,#041a0e)}

</style></head><body>
<div class="bg"><i></i><i></i><i></i></div>
<main class="shell"><section class="side">
<div class="mlogo"></div><h1 id="ti">Bienvenido <span>de vuelta</span></h1><p class="sub" id="su">Ingresa para ver el informe de tesorería</p>
<div class="seg"><button id="b1" class="on">Ingresar</button><button id="b2">Registrarme</button></div>
<div id="fN" class="hid"><label for="nm">Nombre completo</label><div class="f"><input id="nm" autocomplete="name" placeholder="Tu nombre y apellido"></div></div>
<div id="fU"><label for="us">Usuario</label><div class="f"><input id="us" autocapitalize="none" autocomplete="username" placeholder="Tu usuario"></div></div>
<div id="fP"><label for="pw">Clave</label><div class="f"><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" class="eye" data-t="pw" aria-label="Mostrar clave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div id="fA" class="hid"><label for="ak">Clave maestra</label><div class="f"><input id="ak" type="password" placeholder="Solo el administrador la conoce"><button type="button" class="eye" data-t="ak" aria-label="Mostrar clave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<div class="row"><label><input type="checkbox" id="rm" checked> Recordarme</label><button type="button" class="lk" id="fg">¿Olvidaste tu clave?</button></div>
<button class="go" id="go"><span class="sp"></span><span id="gt">Entrar</span></button>
<div id="m"></div>
<div class="or">o</div><button class="ad" id="ad">🔑 Soy el administrador</button>
</section>
<section class="hero"><div class="orb"><div></div></div><b>Iglesia Filadelfia I</b><p>Mayordomía con orden y transparencia</p><span class="tag">Informe de Tesorería</span></section></main>
<script>
const $=s=>document.getElementById(s);let mode='in';
const run=(f,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[f](...a));
const say=(t,c)=>{const m=$('m');m.textContent=t||'';m.className=t?c:''};
function setMode(x){mode=x;say('');const A=x==='admin',R=x==='reg';
 $('fN').classList.toggle('hid',!R);$('fU').classList.toggle('hid',A);$('fP').classList.toggle('hid',A);$('fA').classList.toggle('hid',!A);
 $('b1').classList.toggle('on',!R);$('b2').classList.toggle('on',R);
 $('gt').textContent=R?'Solicitar acceso':A?'Entrar como administrador':'Entrar';
 $('ti').innerHTML=R?'Crear <span>mi cuenta</span>':A?'Acceso <span>administrador</span>':'Bienvenido <span>de vuelta</span>';
 $('su').textContent=R?'El administrador aprobará tu acceso':A?'Usa tu clave maestra':'Ingresa para ver el informe de tesorería';
 $('ad').textContent=A?'← Volver al ingreso normal':'🔑 Soy el administrador';$('pw').autocomplete=R?'new-password':'current-password'}
$('b1').onclick=()=>setMode('in');$('b2').onclick=()=>setMode('reg');$('ad').onclick=()=>setMode(mode==='admin'?'in':'admin');
$('fg').onclick=()=>say('Pídele al administrador que elimine tu cuenta y vuelve a registrarte con una clave nueva.','o');
document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=$(b.dataset.t);i.type=i.type==='password'?'text':'password';b.style.color=i.type==='text'?'#16a34a':''});
async function enter(s,keep){
 const [d,html]=await Promise.all([run('getData',s.token),run('getReport',s.token)]);
 try{const o=JSON.parse(d||'{}');Object.keys(o).forEach(k=>localStorage.setItem(k,o[k]))}catch(e){}
 try{localStorage.removeItem('fil_session');sessionStorage.removeItem('fil_session');(keep?localStorage:sessionStorage).setItem('fil_session',s.token)}catch(e){}
 window.__SRV=d||'{}';window.__FIL=s;document.open();document.write(html);document.close()}
$('go').onclick=async()=>{const b=$('go');b.disabled=true;say('');
 try{
  if(mode==='reg'){await run('register',$('nm').value,$('us').value,$('pw').value);setMode('in');say('Solicitud enviada. Cuando el administrador te apruebe, podrás ingresar.','o')}
  else{say('Entrando…','o');await enter(await(mode==='admin'?run('adminLogin',$('ak').value):run('login',$('us').value,$('pw').value)),$('rm').checked)}
 }catch(e){say((e.message||String(e)).replace(/^Error:\s*/,''),'e')}b.disabled=false};
['us','pw','ak','nm'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()}));
(async()=>{let t=null,k=true;try{t=localStorage.getItem('fil_session');if(!t){t=sessionStorage.getItem('fil_session');k=false}}catch(e){}
 if(!t)return;document.querySelector('.side').style.opacity=.5;try{await enter(await run('check',t),k)}catch(e){try{localStorage.removeItem('fil_session');sessionStorage.removeItem('fil_session')}catch(x){}document.querySelector('.side').style.opacity=1}})();
</script></body></html>
